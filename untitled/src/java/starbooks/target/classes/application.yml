server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/starbooks?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root            # 👉 여기 본인 MySQL 아이디로 수정 (보통 root)
    password: REMOVE_MYSQL_PASSWORD   # ⭐👉 반드시 본인의 MySQL 비밀번호로 변경
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update        # 개발 단계에서는 update / 운영 단계에서는 none 권장
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  jackson:
    serialization:
      fail-on-empty-beans: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.springframework.web: info
  file:
    name: logs/starbooks.log

# Swagger - Springdoc(OpenAPI3)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# JWT 설정
jwt:
  issuer: starbooks-app
  secret: "THIS_IS_TEMP_JWT_SECRET_KEY_CHANGE_IT_PRODUCTION_!!!"   # ⭐👉 꼭! 나중에 더 길고 복잡하게 변경할 것
  expiration: 3600000     # 1시간 (ms)

# Spring Security 기본 설정
security:
  basic:
    enabled: false
